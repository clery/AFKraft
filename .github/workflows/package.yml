name: Validate and package Forever

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check gameplay
        run: lua5.1 scripts/test.lua
      - name: Check packaging
        run: python3 tests/packaging.py
      - name: Build Forever archive
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: WoWIdle-forever
          path: artifacts/AFKcraft-*-forever.zip
          if-no-files-found: error
